
server.port=${BACKEND_PORT:8080}

spring.datasource.url=${url}
spring.datasource.username=${user}
spring.datasource.password=${password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=${JWT_SECRET:dev_only_change_this_secret_to_a_long_random_value_123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.origin=${APP_CORS_ORIGIN:http://localhost:5173}
app.ai-service-url=${AI_SERVICE_URL:http://localhost:8000}

logging.level.org.springframework.security=INFO