# Render/Heroku-style hosts provide PORT; BACKEND_PORT is kept for local use.
server.port=${PORT:${BACKEND_PORT:8080}}

# Preferred names: DB_URL, DB_USER, DB_PASSWORD. The old names (url, user, password) still work as a fallback.
# Note: Spring also matches a bare ${user} against the OS "USER" variable, so the DB_* names are safer.
spring.datasource.url=${DB_URL:${url:}}
spring.datasource.username=${DB_USER:${user:}}
spring.datasource.password=${DB_PASSWORD:${password:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Store and read all timestamps as UTC regardless of the host's time zone.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=${JWT_SECRET:dev_only_change_this_secret_to_a_long_random_value_123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# One or more comma-separated origins (wildcards allowed), e.g. https://ev-smart-ai.vercel.app
app.cors.origin=${APP_CORS_ORIGIN:http://localhost:5173}
app.ai-service-url=${AI_SERVICE_URL:http://localhost:8000}

logging.level.org.springframework.security=INFO
